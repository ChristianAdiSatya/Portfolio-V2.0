<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold-to-Grey Gradient -->
    <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC384" />
      <stop offset="50%" stop-color="#A3A3A3" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
    
    <!-- Neon Glow Filter for futuristic aesthetic -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container accent (subtle tech HUD circle) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#A3A3A3" stroke-width="0.5" stroke-dasharray="2, 4" opacity="0.4" />
  
  <!-- Outer technological target ticks -->
  <path d="M 50 2 L 50 8 M 50 98 L 50 92 M 2 50 L 8 50 M 98 50 L 92 50" stroke="#DEC384" stroke-width="1.5" opacity="0.6" />

  <!-- Core Futuristic Letter 'C' structure -->
  <!-- Designed with sharp geometric tech cuts and high-quality mathematical arcs -->
  <path d="M 68 25
           A 30 30 0 1 0 68 75
           L 78 68
           A 42 42 0 1 1 78 32
           Z"
        fill="url(#c-grad)"
        filter="url(#glow)" />
        
  <!-- Glowing inner core node (resembling a tech circuit or radar target) -->
  <circle cx="32" cy="50" r="4.5" fill="#DEC384" opacity="0.9" />
  
  <!-- Sleek technological crosshair cut -->
  <path d="M 32 38 L 32 62" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" />
</svg>
